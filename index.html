        // All places for search list (simplified from CSV)
        const allPlaces = [

            { name: "京都鐵道博物館", url: "https://maps.app.goo.gl/ZyJRfkYgMyYZk5Dh9", cat: "景點", day: "day1" },

            { name: "京都傳統產業博物館", url: "https://maps.app.goo.gl/ENc738Xffn8fbd377", cat: "景點", day: "day3" },
            { name: "月桂冠大倉紀念館", url: "https://maps.app.goo.gl/BRrekFLcXWuDzFG8A", cat: "景點", day: "day3" },
            { name: "三十三間堂", url: "https://maps.app.goo.gl/HS5mTxEavXj4AN2j6", cat: "景點", day: "day3" },

            { name: "貴船神社", url: "https://maps.app.goo.gl/3KXEEXroG3f1U2UJ7", cat: "景點", day: "day2" },
            { name: "京都車站", url: "https://maps.app.goo.gl/vK4PwpUxw4bq4FTv6?g_st=ac", cat: "實用", day: "day1" },
            { name: "宇治車站", url: "https://maps.app.goo.gl/LxaA9jzzj8aaibtN9?g_st=ic", cat: "實用", day: "day4" },
            { name: "LIFE", url: "https://maps.app.goo.gl/tnRWNYek71ixWFHd8", cat: "實用", day: "day1" },
            { name: "outlet", url: "https://maps.app.goo.gl/FLS59BvjKKRTgJNx5?g_st=ac", cat: "購物娛樂", day: "day6" },
            { name: "👍🥘🥩三嶋亭壽喜燒", url: "https://maps.app.goo.gl/we9r6t63aEpeSFCP8?g_st=ic", cat: "美食", day: "day5" },
            { name: "必吃回轉壽司", url: "https://maps.app.goo.gl/qdL988wsW2Yv1eqW8", cat: "美食", day: "day5" },
            { name: "🍵🍰🍜🍦中村藤吉", url: "https://maps.app.goo.gl/FH6TsvBhS3eV6cRG8?g_st=ac", cat: "美食", day: "day4" },
            { name: "戎橋", url: "https://maps.app.goo.gl/QGZF3XeBfY4Yx33FA", cat: "景點", day: "day5" },
            { name: "心齋橋筋", url: "https://maps.app.goo.gl/7pTA27YsGY8Y9f2w9?g_st=ac", cat: "景點", day: "day5" },
            { name: "7-11(車站)", url: "https://maps.app.goo.gl/doTnG1syTseAuNna8", cat: "實用", day: "day1" },
            { name: "全家(1F)", url: "https://maps.app.goo.gl/uLvwWSD76t5TXQo9A", cat: "實用", day: "day1" },
            { name: "LAWSON(近)", url: "https://maps.app.goo.gl/vPAojxvgXiWQcceVA", cat: "實用", day: "day1" }
        ];
        
        const categoryConfig = {
            "住宿": { color: "#14b8a6", icon: "🏨", bg: "bg-teal-100", text: "text-teal-700" },
            "景點": { color: "#0ea5e9", icon: "🏯", bg: "bg-sky-100", text: "text-sky-700" },
            "美食": { color: "#f43f5e", icon: "🍜", bg: "bg-rose-100", text: "text-rose-700" },
            "購物娛樂": { color: "#8b5cf6", icon: "🛍️", bg: "bg-violet-100", text: "text-violet-700" },
            "實用": { color: "#64748b", icon: "🛠️", bg: "bg-slate-100", text: "text-slate-700" }
        };
        
        function createDayCards() {
            const container = document.getElementById('dayCards');
            container.innerHTML = '';
            
            daysData.forEach(day => {
                const card = document.createElement('div');
                card.className = `day-card group bg-white border border-slate-200 rounded-3xl p-5 flex flex-col hover:border-teal-300`;
                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div>
                            <div class="text-xs font-mono tracking-[1px] text-slate-400">${day.num}</div>
                            <div class="mt-1 text-xl font-bold text-slate-900 group-hover:text-teal-700 transition">${day.emoji} ${day.title}</div>
                        </div>
                        <div class="text-4xl opacity-80 group-hover:scale-110 transition">${day.emoji}</div>
                    </div>
                    <div class="mt-3 text-sm text-slate-600 line-clamp-2">${day.hook}</div>
                    <div class="mt-auto pt-4 flex items-center justify-between text-xs">
                        <div class="font-medium text-teal-600">${day.places.length} 個推薦點位</div>
                        <div class="px-3 py-1 bg-teal-50 text-teal-700 rounded-2xl text-[10px] font-bold">點擊查看</div>
                    </div>
                `;
                
                card.onclick = () => showDayDetail(day.id);
                container.appendChild(card);
            });
        }
        
        function showDayDetail(dayId) {
            const day = daysData.find(d => d.id === dayId);
            if (!day) return;
            
            currentDayFilter = dayId;
            
            // Update panel
            document.getElementById('dayDetailTitle').innerHTML = `${day.emoji} ${day.num} ${day.title}`;
            document.getElementById('dayDetailSubtitle').innerHTML = day.hook;
            document.getElementById('dayOverviewText').innerHTML = `<p>${day.overview}</p>`;
            
            // Render day places
            const listContainer = document.getElementById('dayPlacesList');
            listContainer.innerHTML = '';
            
            day.places.forEach(place => {
                const div = document.createElement('div');
                div.className = `place-row flex items-start gap-x-4 p-4 bg-white border border-slate-100 rounded-2xl`;
                
                const fullPlace = allPlaces.find(p => p.name === place.name) || {};
                
                div.innerHTML = `
                    <div class="flex-1">
                        <div class="font-semibold text-slate-800">${place.name}</div>
                        <div class="text-sm text-slate-600 mt-1">${place.note}</div>
                    </div>
                    <div>
                        <button onclick="event.stopImmediatePropagation(); openGoogleMap('${fullPlace.url || '#'}');" 
                                class="px-4 py-2 text-xs font-bold bg-teal-700 hover:bg-teal-800 text-white rounded-3xl transition">
                            開啟 Google 地圖
                        </button>
                    </div>
                `;
                listContainer.appendChild(div);
            });
            
            document.getElementById('dayPlaceCount').innerHTML = `${day.places.length} 個點位`;
            
            // Show panel
            document.getElementById('dayDetailPanel').classList.remove('hidden');
            document.getElementById('dayDetailPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
            
            // Filter map
            filterMapByDay(dayId);
        }
        
        function hideDayDetail() {
            document.getElementById('dayDetailPanel').classList.add('hidden');
            currentDayFilter = null;
            showAllMarkers();
            document.getElementById('mapStatus').innerHTML = '';
        }
        
        function filterMapByDay(dayId) {
            if (!map) return;
            
            // Remove all current markers
            Object.values(allMarkers).forEach(marker => map.removeLayer(marker));
            allMarkers = {};
            
            const dayPoints = mapPoints.filter(p => p.day === dayId);
            
            dayPoints.forEach(point => {
                const icon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="background-color: ${point.color}; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.3); font-size:13px;">${categoryConfig[point.category] ? categoryConfig[point.category].icon : '📍'}</div>`,
                    iconSize: [26, 26],
                    iconAnchor: [13, 13],
                    popupAnchor: [0, -13]
                });
                
                const marker = L.marker([point.lat, point.lng], { icon }).addTo(map);
                
                const popupHtml = `
                    <div style="min-width:210px; font-family:'Noto Sans TC',system-ui,sans-serif;">
                        <div style="font-weight:700; font-size:15px; color:#134e4b; margin-bottom:4px;">${point.name}</div>
                        <div style="font-size:12px; color:#64748b; margin-bottom:8px;">${point.category}</div>
                        <div style="font-size:13px; line-height:1.5; color:#334155;">${point.desc}</div>
                    </div>
                `;
                marker.bindPopup(popupHtml);
                allMarkers[point.id] = marker;
            });
            
            // Fit bounds to day's points
            if (dayPoints.length > 0) {
                const bounds = L.latLngBounds(dayPoints.map(p => [p.lat, p.lng]));
                map.flyToBounds(bounds, { padding: [40, 40], duration: 1.2 });
            }
            
            document.getElementById('mapStatus').innerHTML = `・目前顯示：${daysData.find(d => d.id === dayId).title}`;
        }
        
        function showAllMarkers() {
            if (!map) return;
            
            Object.values(allMarkers).forEach(marker => map.removeLayer(marker));
            allMarkers = {};
            
            mapPoints.forEach(point => {
                const icon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="background-color: ${point.color}; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2.5px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.25); font-size:12px;">${categoryConfig[point.category] ? categoryConfig[point.category].icon : '📍'}</div>`,
                    iconSize: [24, 24],
                    iconAnchor: [12, 12],
                    popupAnchor: [0, -12]
                });
                
                const marker = L.marker([point.lat, point.lng], { icon }).addTo(map);
                
                const popupHtml = `
                    <div style="min-width:210px; font-family:'Noto Sans TC',system-ui,sans-serif;">
                        <div style="font-weight:700; font-size:15px; color:#134e4b; margin-bottom:4px;">${point.name}</div>
                        <div style="font-size:12px; color:#64748b; margin-bottom:8px;">${point.category}・${daysData.find(d => d.id === point.day)?.num || ''}</div>
                        <div style="font-size:13px; line-height:1.5; color:#334155;">${point.desc}</div>
                    </div>
                `;
                marker.bindPopup(popupHtml);
                allMarkers[point.id] = marker;
            });
            
            map.flyTo([34.92, 135.72], 10, { duration: 1.3 });
            document.getElementById('mapStatus').innerHTML = '';
        }
        
        function initializeMap() {
            map = L.map('map', { zoomControl: true, attributionControl: false }).setView([34.92, 135.72], 10);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                className: 'map-tiles'
            }).addTo(map);
            
            showAllMarkers(); // initial all markers
        }
        
        function renderFullPlacesList(filtered = null) {
            const container = document.getElementById('fullPlacesList');
            container.innerHTML = '';
            
            let list = filtered || allPlaces;
            
            if (list.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm">沒有符合條件的點位</div>`;
                return;
            }
            
            list.forEach(place => {
                const config = categoryConfig[place.cat] || { icon: "📍", bg: "bg-slate-100", text: "text-slate-600" };
                const dayInfo = daysData.find(d => d.id === place.day);
                
                const row = document.createElement('div');
                row.className = `flex items-center gap-x-4 px-5 py-3 border-b last:border-b-0 hover:bg-slate-50 cursor-pointer`;
                
                row.innerHTML = `
                    <div class="flex-shrink-0 w-8 h-8 ${config.bg} rounded-2xl flex items-center justify-center text-lg">${config.icon}</div>
                    <div class="flex-1 min-w-0">
                        <div class="font-medium text-slate-800">${place.name}</div>
                        <div class="flex items-center gap-x-2 text-xs mt-0.5">
                            <span class="${config.text}">${place.cat}</span>
                            ${dayInfo ? `<span class="text-teal-600 font-mono text-[10px]">${dayInfo.num}</span>` : ''}
                        </div>
                    </div>
                    <button onclick="event.stopImmediatePropagation(); openGoogleMap('${place.url}');" 
                            class="px-4 py-1.5 text-xs font-bold border border-slate-300 hover:bg-teal-50 hover:border-teal-300 text-teal-700 rounded-3xl transition">
                        Google 地圖
                    </button>
                `;
                
                row.onclick = () => {
                    if (place.day) {
                        showDayDetail(place.day);
                    } else {
                        openGoogleMap(place.url);
                    }
                };
                
                container.appendChild(row);
            });
        }
        
        function setupGlobalSearch() {
            const input = document.getElementById('globalSearch');
            input.addEventListener('input', () => {
                const term = input.value.toLowerCase().trim();
                if (!term) {
                    renderFullPlacesList();
                    return;
                }
                const filtered = allPlaces.filter(p => p.name.toLowerCase().includes(term) || p.cat.toLowerCase().includes(term));
                renderFullPlacesList(filtered);
            });
        }
        
        function openGoogleMap(url) {
            if (url && url !== '#') window.open(url, '_blank');
        }
        
        function showAllDays() {
            hideDayDetail();
            showAllMarkers();
            document.getElementById('globalSearch').value = '';
            renderFullPlacesList();
        }
        
        function resetMapAndDays() {
            hideDayDetail();
            showAllMarkers();
        }
        
        function initializeApp() {
            createDayCards();
            initializeMap();
            renderFullPlacesList();
            setupGlobalSearch();
            
            // Welcome hint
            setTimeout(() => {
                console.log('%c[2026 Daily Itinerary Map v3] Ready. Click any day card to explore detailed plan + filtered map.', 'color:#64748b');
            }, 800);
        }
        
        window.onload = initializeApp;
    </script>
